name: Build Setup EXE (Windows)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-setup:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app metadata
        shell: pwsh
        run: |
          $json = python -c "import json; from core.version import APP_NAME,__version__; print(json.dumps({'name':APP_NAME,'version':__version__}))"
          $meta = $json | ConvertFrom-Json
          "APP_NAME=$($meta.name)" >> $env:GITHUB_ENV
          "APP_VERSION=$($meta.version)" >> $env:GITHUB_ENV
          "APP_EXE=$($meta.name).exe" >> $env:GITHUB_ENV

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($tagVersion -ne "${env:APP_VERSION}") {
            Write-Error "Tag version ($tagVersion) does not match core/version.py (${env:APP_VERSION})."
            exit 1
          }

      - name: Smoke test (compile check)
        shell: pwsh
        run: python -m compileall -q .

      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build app (PyInstaller onedir)
        shell: pwsh
        run: python build.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="$env:APP_VERSION" /DMyAppSlug="CXHarvest" installer\setup.iss

      - name: Collect setup artifact metadata
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) {
            Write-Error "Setup.exe was not generated."
            exit 1
          }
          $hash = Get-FileHash $setup.FullName -Algorithm SHA256
          $shaFile = "$($setup.FullName).sha256"
          "$($hash.Hash.ToLower())  $($setup.Name)" | Out-File -FilePath $shaFile -Encoding ascii

          "SETUP_EXE=$($setup.FullName)" >> $env:GITHUB_ENV
          "SETUP_SHA256=$shaFile" >> $env:GITHUB_ENV

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe-${{ env.APP_VERSION }}
          path: |
            ${{ env.SETUP_EXE }}
            ${{ env.SETUP_SHA256 }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ env.SETUP_EXE }}
            ${{ env.SETUP_SHA256 }}
          overwrite_files: true
          generate_release_notes: true

      - name: Cleanup old nightly setup assets
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "nightly";
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assets = release.data.assets || [];
              const setupPattern = /\.(exe|sha256)$/i;
              for (const asset of assets) {
                if (setupPattern.test(asset.name)) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                  });
                  core.info(`Deleted old nightly asset: ${asset.name}`);
                }
              }
            } catch (err) {
              core.info(`Nightly release not found or cleanup skipped: ${err.message}`);
            }

      - name: Create/Update Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          files: |
            ${{ env.SETUP_EXE }}
            ${{ env.SETUP_SHA256 }}
          overwrite_files: true
          generate_release_notes: false
          body: |
            Auto-generated nightly build.
            Commit: ${{ github.sha }}
